<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<script>
			(() => {
				try {
					const stored = localStorage.getItem('tabler.theme');
					const dark =
						stored === 'dark' ||
						(stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
				} catch {
					// storage unavailable, fall back to light
				}
			})();
		</script>
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
		<link rel="icon" type="image/png" href="https://cdn.fatih.live/logo.png" />
		<link rel="apple-touch-icon" href="https://cdn.fatih.live/logo.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<link rel="sitemap" type="application/xml" href="/sitemap.xml" />
		<link rel="preconnect" href="https://cdn.fatih.live" crossorigin />
		<title>Tabler · Fatih Yılmaz</title>
		<meta name="application-name" content="Tabler" />
		<meta name="author" content="Fatih Yılmaz" />
		<meta name="publisher" content="Fatih Yılmaz" />
		<meta
			name="description"
			content="Query CSV, Excel, Parquet and JSON files with SQL directly in your browser. Tabler runs DuckDB in-browser, so your data never leaves your device. No signup, no upload."
		/>

		<meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1" />

		/>
